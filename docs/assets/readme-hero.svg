<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">CC Anti-Ban — Claude 用不了了，你确定是封号？</title>
  <desc id="desc">面向 macOS 的 Claude Code 环境排雷。先查环境，别只凭报错猜。TIMEOUT、连接失败、代理冲突仅为症状示意。</desc>
  <rect width="1280" height="500" fill="#f3efe6"/>
  <path d="M880 96V380" stroke="#c9c2b6" stroke-width="2"/>
  <rect x="56" y="43" width="9" height="30" fill="#d74727"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="82" y="68" fill="#1a1a18" font-size="30" font-weight="800" letter-spacing="1">CC Anti-Ban</text>
    <text x="1224" y="65" fill="#59574f" font-size="20" font-weight="600" text-anchor="end">Claude Code 环境排雷 / macOS</text>
    <text x="51" y="176" fill="#1a1a18" font-size="76" font-weight="800" letter-spacing="-2">Claude 用不了了，</text>
    <text x="51" y="276" fill="#1a1a18" font-size="84" font-weight="800" letter-spacing="-2">你确定是<tspan fill="#d74727">封号？</tspan></text>
    <path d="M380 296H635" stroke="#d74727" stroke-width="7"/>
    <text x="57" y="353" fill="#45443e" font-size="28" font-weight="500">先查环境，别只凭报错猜。</text>
    <text x="927" y="127" fill="#777166" font-size="17">症状示意 · 非真实报告</text>
    <text x="922" y="183" fill="#1a1a18" font-size="36" font-weight="750" letter-spacing="1">TIMEOUT</text>
    <text x="922" y="238" fill="#1a1a18" font-size="34" font-weight="700">连接失败</text>
    <text x="922" y="293" fill="#1a1a18" font-size="34" font-weight="700">代理冲突</text>
    <text x="1160" y="359" fill="#d74727" font-size="172" font-weight="800" text-anchor="middle">?</text>
    <path d="M925 345H969L983 330M1005 358L1018 345H1054" fill="none" stroke="#d74727" stroke-width="6" stroke-linecap="square"/>
    <path d="M980 357L1007 329" stroke="#d74727" stroke-width="3"/>
  </g>
  <rect y="420" width="1280" height="80" fill="#1a1a18"/>
  <rect x="56" y="452" width="26" height="5" fill="#f28358"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#f3efe6">
    <text x="99" y="464" font-size="18" font-weight="600" letter-spacing="1.5">FOR CLAUDE CODE ON macOS</text>
    <text x="1224" y="464" font-size="17" text-anchor="end" letter-spacing="1">INSTALL · CONFIG · PROXY</text>
  </g>
</svg>
