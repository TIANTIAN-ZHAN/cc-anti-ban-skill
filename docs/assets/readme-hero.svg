<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Claude 封号如何破解？</title>
  <desc id="desc">CC Anti-Ban｜Claude 封号急救包。自查清单、证据整理、申诉准备，一次备齐。问题导向指南，不是账号解封承诺。</desc>
  <rect width="1280" height="500" fill="#f3efe6"/>
  <rect x="56" y="43" width="9" height="30" fill="#d74727"/>
  <path d="M880 108V380" stroke="#c9c2b6" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="82" y="68" fill="#1a1a18" font-size="28" font-weight="800">CC Anti-Ban｜Claude 封号急救包</text>
    <text x="1224" y="65" fill="#59574f" font-size="18" font-weight="600" text-anchor="end">自查指南 + macOS 本地工具</text>
    <text x="51" y="181" fill="#1a1a18" font-size="86" font-weight="800" letter-spacing="-2">Claude 封号</text>
    <text x="51" y="287" fill="#d74727" font-size="100" font-weight="800" letter-spacing="-2">如何破解？</text>
    <path d="M58 307H540" stroke="#d74727" stroke-width="6"/>
    <text x="57" y="367" fill="#45443e" font-size="27" font-weight="500">自查清单、证据整理、申诉准备，一次备齐。</text>
    <text x="929" y="151" fill="#777166" font-size="17" letter-spacing="1">从问题到下一步</text>
    <text x="928" y="214" fill="#d74727" font-size="22" font-weight="750">01</text>
    <text x="981" y="214" fill="#1a1a18" font-size="32" font-weight="700">按需自查</text>
    <text x="928" y="278" fill="#d74727" font-size="22" font-weight="750">02</text>
    <text x="981" y="278" fill="#1a1a18" font-size="32" font-weight="700">整理证据</text>
    <text x="928" y="342" fill="#d74727" font-size="22" font-weight="750">03</text>
    <text x="981" y="342" fill="#1a1a18" font-size="32" font-weight="700">准备申诉</text>
  </g>
  <rect y="420" width="1280" height="80" fill="#1a1a18"/>
  <rect x="56" y="452" width="26" height="5" fill="#f28358"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#f3efe6">
    <text x="99" y="464" font-size="17" font-weight="600" letter-spacing="1">FOR INDEPENDENT CODING AGENTS</text>
    <text x="1224" y="464" font-size="17" text-anchor="end" letter-spacing="1">CHECK · ORGANIZE · PREPARE</text>
  </g>
</svg>
